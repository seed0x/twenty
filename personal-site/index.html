<body data-pattern="stipple">
  <!-- Boot screen ("Welcome to …") -->
  <div id="boot" class="boot" hidden aria-hidden="true">
    <div class="boot-box">
      <div class="boot-icon" id="boot-icon"></div>
      <div class="boot-text" id="boot-text">Welcome.</div>
      <div class="boot-bar"><i id="boot-progress"></i></div>
      <div class="boot-hint">click to skip</div>
    </div>
  </div>

  <!-- Menu bar (built by js/desktop.js) -->
  <header id="menubar" class="menubar" role="menubar" aria-label="Menu bar"></header>

  <!-- Desktop: icons + windows live here (built by js/desktop.js) -->
  <main id="desktop" class="desktop" aria-label="Desktop"></main>

  <!-- Modal dialogs are appended here -->
  <div id="dialogs"></div>

  <noscript>
    <div class="noscript">
      <h1>Vlad Kolesnik</h1>
      <p>This site is an interactive desktop and needs JavaScript. The content is defined in
        <code>js/content.js</code> and the blog posts live in <code>posts/</code>.</p>
    </div>
  </noscript>

  <script src="js/content.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/apps.js"></script>

</body>
</html>
